name: Check doc examples

# Moved here from metel-docs-internal (ADR-0051 step 3) -- this repo also
# runs check-mdx.yml and rfc-check.yml, ported the same way. Runs the checker
# metel-core builds (tools/check_doc_examples.py) against the *current* docs
# content on every PR -- so a broken example is caught the moment it's
# introduced here, rather than waiting for metel-core's `docs` submodule
# pointer to next move and pick it up. Does not check README.md; that file
# lives in metel-core, and its own `doc-examples` CI job covers it.
#
# metel-core#696: downloads metel-core's rolling `develop-latest`
# pre-release, not the latest *stable* release. AGENTS.md's Branch Workflow
# requires documenting a language-visible change the moment it lands on
# `develop`; checking against the last stable release meant a feature
# documented the day it merged couldn't be checked for real until the next
# release shipped, with no way to express "valid on develop, not yet
# released" short of a permanent skip/expect-fail marker. metel-core's own
# `publish-develop-binary` job (ci.yml) rebuilds and republishes
# `develop-latest` on every push to `develop`, so this job's own CI cost is
# unchanged -- still a download, not a build.
#
# The paths below are the *directories* getting-started and reference, not
# their `tutorials`/`spec` subdirectories, plus `blog`. The narrower paths
# this job used until now silently excluded three files that read as ordinary
# working Metel: getting-started/quickstart.mdx and intro.mdx (siblings of
# `tutorials/`, not inside it), reference/error-codes.md (a sibling of
# `spec/`), and blog/ wasn't listed at all. Two real, uncompilable examples
# reached production through exactly that gap -- quickstart's `public fun
# greet` missing its `-> ()` return type, and the blog post declaring a
# non-aspect method inside `extend Person: Greet` -- both found by hand,
# neither reachable by this job as it was configured (metel-core#693).
#
# release-notes/ and rfcs/ are deliberately excluded, not overlooked: both
# exist to document rejected, superseded, or not-yet-built syntax that cannot
# compile by design. See metel-core's PROCESSES.md
# § "What is deliberately not checked".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both the develop-latest pre-release asset and tools/check_doc_examples.py
      # are public reads on metel-core -- the built-in GITHUB_TOKEN covers
      # both, no new secret to provision. Explicit `develop-latest` tag,
      # not the bare form -- `gh release download` with no tag argument
      # resolves to the latest *stable, non-prerelease* release and would
      # silently skip this one.
      - name: Download metel-core's develop-latest binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download develop-latest --repo metel-lang/metel-core --pattern 'metel-linux-x86_64' --output metel
          chmod +x metel

      # Fetched fresh every run rather than vendored, so this job always
      # checks against metel-core's current script with nothing to keep in
      # sync by hand. From develop specifically, not the default branch
      # (main) -- main only moves at release time, so a script fix merged
      # today wouldn't reach this job for up to a full release cycle
      # otherwise, defeating "current" entirely. Found the hard way: every
      # check_doc_examples.py fix landed this session was invisible to this
      # exact job until now.
      - name: Fetch the checker script from metel-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/metel-lang/metel-core/contents/tools/check_doc_examples.py?ref=develop" --jq '.content' | base64 -d > check_doc_examples.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: check doc examples
        run: |
          python3 check_doc_examples.py --binary ./metel \
            getting-started \
            blog \
            reference
